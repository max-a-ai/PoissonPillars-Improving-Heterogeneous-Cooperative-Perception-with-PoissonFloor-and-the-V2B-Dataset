[project]
name = "heal-env"
version = "0.1.0"
description = "Environment for HEAL / OpenCOOD as used by PoissonPillars"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy<2",
    "cython",
    "tensorboardX",
    "shapely",
    "einops",
    "imageio",
    "matplotlib",
    "open3d",
    "opencv-python",
    "pyyaml",
    "tqdm",
    "easydict",
    "scikit-image",
    "pypcd4>=1.1",
    "torch>=2.4",
    "torchvision",
    "spconv-cu120",              # sparse conv backend for the SECOND/VoxelNet encoder
    "icecream>=2.2.0",
    "timm>=1.0.29",
    "efficientnet-pytorch>=0.7.1",
    "wandb>=0.30.0",
    "h5py>=3.16.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
