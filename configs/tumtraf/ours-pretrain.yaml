# PoissonPillars: floor-anchored masked pretraining on TUMTraf V2X
name: tumtraf-ours-pretrain
fork: heal
pillar_pooling: attn
pretrain:
  mask_ratio: 0.7
  bins: 12
anchors:
  car:
  - 3.9
  - 1.6
  - 1.56
  bicycle:
  - 1.9
  - 0.7
  - 1.5
  pedestrian:
  - 0.8
  - 0.6
  - 1.73
class_thresholds:
  pedestrian:
  - 0.5
  - 0.35
base: opv2v/Single/m1_pointpillar_pretrain.yaml
sources:
  train:
  - dataset: tumtraf-seq-opv2v-rebase-poisson
    split: train
  test:
  - dataset: tumtraf-seq-opv2v-rebase-poisson
    split: validate
grid:
  range:
  - -102.4
  - -40.0
  - -3.0
  - 102.4
  - 40.0
  - 3.0
  voxel:
  - 0.4
  - 0.4
  - 6.0
train:
  epochs: 15
  holdout:
  - tumtraf_train_09
  batch_size: 8
  eval_freq: 1
overrides:
  postprocess.max_num: 300
