# Tab. 4, TUMTraf V2X: PoissonPillars, RSU row
name: tumtraf-ours-rsu
fork: heal
pillar_pooling: attn
init_from: outputs/tumtraf-ours-pretrain
anchors:
  car:
  - 3.9
  - 1.6
  - 1.56
  bicycle:
  - 1.9
  - 0.7
  - 1.5
  pedestrian:
  - 0.8
  - 0.6
  - 1.73
class_thresholds:
  pedestrian:
  - 0.5
  - 0.35
base: opv2v/Single/m1_pointpillar_pretrain.yaml
sources:
  train:
  - dataset: tumtraf-rsu-opv2v-rebase-poisson
    split: train
  test:
  - dataset: tumtraf-rsu-opv2v-rebase-poisson
    split: validate
grid:
  range:
  - -102.4
  - -40.0
  - -3.0
  - 102.4
  - 40.0
  - 3.0
  voxel:
  - 0.4
  - 0.4
  - 6.0
train:
  epochs: 20
  holdout:
  - tumtraf_train_09
  batch_size: 8
  eval_freq: 1
overrides:
  postprocess.max_num: 300
  postprocess.nms_thresh: 0.15
