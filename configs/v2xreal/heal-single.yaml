# Tab. 3: HEAL, no fusion
name: v2xreal-heal-single
fork: heal
anchors:
  car:
  - 3.9
  - 1.6
  - 1.56
  bicycle:
  - 1.9
  - 0.7
  - 1.5
  pedestrian:
  - 0.8
  - 0.6
  - 1.73
class_thresholds:
  pedestrian:
  - 0.5
  - 0.35
base: opv2v/Single/m1_pointpillar_pretrain.yaml
sources:
  train:
  - dataset: v2xreal-v2v-bike-opv2v
    split: train
  val:
  - dataset: v2xreal-v2v-bike-opv2v
    split: validate
  test:
  - dataset: v2xreal-v2v-bike-opv2v
    split: test
grid:
  range:
  - -102.4
  - -40.0
  - -5.0
  - 102.4
  - 40.0
  - 3.0
  voxel:
  - 0.4
  - 0.4
  - 8.0
train:
  epochs: 20
  batch_size: 8
  eval_freq: 1
  keep_epochs: true
overrides:
  postprocess.max_num: 300
  postprocess.nms_thresh: 0.15
