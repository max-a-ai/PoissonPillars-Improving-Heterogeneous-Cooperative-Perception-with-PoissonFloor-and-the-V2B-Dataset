# HEAL + F-Cooper on V2X-Real, warm start of the V2B HEAL fused row
name: v2xreal-heal-fcooper-v1
fork: heal
fused_augment: true
fusion_trunk: single
init_from: outputs/v2xreal-heal-single-v1
anchors:
  car:
  - 3.9
  - 1.6
  - 1.56
  bicycle:
  - 1.9
  - 0.7
  - 1.5
  pedestrian:
  - 0.8
  - 0.6
  - 1.73
class_thresholds:
  pedestrian:
  - 0.5
  - 0.35
base: opv2v/LiDAROnly/lidar_fcooper.yaml
sources:
  train:
  - dataset: v2xreal-v2v-bike-opv2v
    split: train
  val:
  - dataset: v2xreal-v2v-bike-opv2v
    split: test
grid:
  range:
  - -102.4
  - -40.0
  - -5.0
  - 102.4
  - 40.0
  - 3.0
  voxel:
  - 0.4
  - 0.4
  - 8.0
train:
  epochs: 20
  batch_size: 4
  eval_freq: 1
overrides:
  postprocess.max_num: 300
  postprocess.nms_thresh: 0.15
