# Tab. 3: PoissonPillars + AttFuse
name: v2xreal-ours-attfuse
fork: heal
fused_augment: true
pillar_pooling: attn
fusion_trunk: single
init_from: outputs/v2xreal-ours-single
anchors:
  car:
  - 3.9
  - 1.6
  - 1.56
  bicycle:
  - 1.9
  - 0.7
  - 1.5
  pedestrian:
  - 0.8
  - 0.6
  - 1.73
class_thresholds:
  pedestrian:
  - 0.5
  - 0.35
base: opv2v/LiDAROnly/lidar_attfuse.yaml
sources:
  train:
  - dataset: v2xreal-v2v-bike-opv2v-rebase-poisson
    split: train
  val:
  - dataset: v2xreal-v2v-bike-opv2v-rebase-poisson
    split: validate
  test:
  - dataset: v2xreal-v2v-bike-opv2v-rebase-poisson
    split: test
grid:
  range:
  - -102.4
  - -40.0
  - -3.0
  - 102.4
  - 40.0
  - 3.0
  voxel:
  - 0.4
  - 0.4
  - 6.0
train:
  epochs: 20
  batch_size: 4
  eval_freq: 1
  keep_epochs: true
overrides:
  postprocess.max_num: 300
  postprocess.nms_thresh: 0.15
