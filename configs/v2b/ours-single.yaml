# Tab. 4, V2B: PoissonPillars, vehicle and bicycle rows
name: v2b-ours-single
fork: heal
pillar_pooling: attn
init_from: outputs/waymo-ours-single
anchors:
  car:
  - 3.9
  - 1.6
  - 1.56
  bicycle:
  - 1.9
  - 0.7
  - 1.5
  pedestrian:
  - 0.8
  - 0.6
  - 1.73
class_thresholds:
  pedestrian:
  - 0.5
  - 0.35
base: opv2v/Single/m1_pointpillar_pretrain.yaml
sources:
  train:
  - dataset: v2b-coop-v2-hand-opv2v-rebase-poisson
    split: train
    scenes:
    - scene_01
    - scene_02
    - scene_03
    - scene_05
    - scene_06
    - scene_08
    - scene_11
    - scene_12
    - scene_14
  - dataset: v2b-coop-v2-hand-opv2v-rebase-poisson
    split: validate
    scenes:
    - scene_07
  val:
  - dataset: v2b-coop-v2-hand-opv2v-rebase-poisson
    split: train
    scenes:
    - scene_09
    - scene_10
  test:
  - dataset: v2b-coop-v2-hand-opv2v-rebase-poisson
    split: train
    scenes:
    - scene_04
  - dataset: v2b-coop-v2-hand-opv2v-rebase-poisson
    split: test
    scenes:
    - scene_13
grid:
  range:
  - -51.2
  - -51.2
  - -3.0
  - 51.2
  - 51.2
  - 3.0
  voxel:
  - 0.4
  - 0.4
  - 6.0
train:
  epochs: 20
  batch_size: 8
  eval_freq: 1
overrides:
  postprocess.max_num: 300
  postprocess.nms_thresh: 0.15
max_range: 50
